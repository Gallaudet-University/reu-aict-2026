---
layout: default
---
<section class="page-hero {{ page.hero_class }}">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>

<section class="page-body">
  <div class="container prose">
    {{ content }}
  </div>
</section>
