title: "REU AICT 2026"
tagline: "Research Experience for Undergraduates in Accessible Information & Communication Technology"
description: >-
  An NSF-funded Research Experience for Undergraduates (REU) Site at
  Gallaudet University, focused on Accessible Information &
  Communication Technology (AICT) — bringing deaf, hard-of-hearing,
  and hearing undergraduates together to do research at the
  intersection of AI, accessibility, and communication.
